name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          unzip -o "$ZIP_FILE" -d extracted
          rm "$ZIP_FILE"

          if [ -d "extracted/autocat_site_ready" ]; then
            cp -a extracted/autocat_site_ready/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted

      - name: Commit extracted files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git commit -m "Extract project files" || exit 0
          git push
